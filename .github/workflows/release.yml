name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LINGUA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LINGUA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          LINGUA_KEYSTORE_PASSWORD: ${{ secrets.LINGUA_KEYSTORE_PASSWORD }}
          LINGUA_KEY_ALIAS: ${{ secrets.LINGUA_KEY_ALIAS }}
          LINGUA_KEY_PASSWORD: ${{ secrets.LINGUA_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Collect
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/lingua-player-${GITHUB_REF_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/lingua-player-${GITHUB_REF_NAME}.apk"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
